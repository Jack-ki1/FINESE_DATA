<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="#0F172A" />
  <rect x="0.5" y="0.5" width="399" height="259" rx="15.5" stroke="rgba(255,255,255,0.08)" />

  <!-- Code window header -->
  <circle cx="28" cy="24" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="44" cy="24" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="60" cy="24" r="4.5" fill="#10B981" opacity="0.8" />
  <text x="80" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">sql_query_editor.sql</text>

  <!-- Query input box -->
  <g transform="translate(24, 48)">
    <rect width="352" height="90" rx="8" fill="#182235" stroke="rgba(139,92,246,0.3)" />
    <text x="16" y="26" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F43F5E">SELECT</text>
    <text x="70" y="26" font-family="'Courier New', monospace" font-size="12" fill="#E2E8F0">region, <tspan fill="#38BDF8">COUNT</tspan>(*) <tspan fill="#F43F5E">AS</tspan> total_orders</text>
    <text x="16" y="46" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F43F5E">FROM</text>
    <text x="56" y="46" font-family="'Courier New', monospace" font-size="12" fill="#E2E8F0">dataset</text>
    <text x="16" y="66" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F43F5E">GROUP BY</text>
    <text x="84" y="66" font-family="'Courier New', monospace" font-size="12" fill="#E2E8F0">region</text>
    <text x="16" y="84" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#F43F5E">LIMIT</text>
    <text x="60" y="84" font-family="'Courier New', monospace" font-size="12" fill="#E2E8F0">10;</text>
  </g>

  <!-- Execution result badge -->
  <g transform="translate(24, 150)">
    <rect width="352" height="84" rx="8" fill="#131D31" stroke="rgba(255,255,255,0.06)" />
    <!-- Row 1 -->
    <rect x="12" y="10" width="328" height="22" rx="4" fill="rgba(255,255,255,0.03)" />
    <text x="24" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Nairobi East</text>
    <text x="280" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">12,490</text>
    <!-- Row 2 -->
    <text x="24" y="47" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Mombasa South</text>
    <text x="280" y="47" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">8,730</text>
    <!-- Status footer -->
    <text x="24" y="70" font-family="system-ui, sans-serif" font-size="9.5" fill="#10B981">✓ Executed in 0.38ms over local memory</text>
  </g>
</svg>
