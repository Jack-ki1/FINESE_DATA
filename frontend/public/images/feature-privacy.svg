<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="secGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="260" rx="16" fill="#0F172A" />
  <rect x="0.5" y="0.5" width="399" height="259" rx="15.5" stroke="rgba(255,255,255,0.08)" />

  <!-- Shield in center -->
  <g transform="translate(140, 36)">
    <path d="M60 10L105 28V75C105 110 60 135 60 135C60 135 15 110 15 75V28L60 10Z" fill="url(#secGrad)" opacity="0.15" />
    <path d="M60 10L105 28V75C105 110 60 135 60 135C60 135 15 110 15 75V28L60 10Z" stroke="url(#secGrad)" stroke-width="2.5" stroke-linejoin="round" />
