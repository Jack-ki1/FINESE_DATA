    <circle cx="24" cy="24" r="5" fill="#10B981" />
    <text x="38" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">100% Client-Side In-Memory Guarantee</text>
    <text x="38" y="37" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">0 network packets emitted • Verifiable in DevTools</text>
  </g>
