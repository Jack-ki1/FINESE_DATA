      <text x="32" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748B">#</text>
      <text x="64" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">REGION</text>
      <text x="180" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">UNITS</text>
      <text x="280" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">REVENUE ($)</text>
      <text x="400" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">SEGMENT</text>
      <text x="520" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">STATUS</text>
      <text x="660" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">TRANSFORMATION</text>

      <!-- Row 1 -->
      <g transform="translate(16, 84)">
        <text x="16" y="16" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748B">1</text>
        <text x="48" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Nairobi Central</text>
        <text x="164" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#E2E8F0">1,240</text>
        <text x="264" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">$68,200.00</text>
        <text x="384" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#E2E8F0">Enterprise</text>
        <rect x="504" y="3" width="56" height="18" rx="4" fill="rgba(16,185,129,0.18)" />
        <text x="514" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#10B981">VERIFIED</text>
        <text x="644" y="16" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Trimmed whitespace</text>
        <line x1="0" y1="26" x2="802" y2="26" stroke="rgba(255,255,255,0.04)" />
      </g>

      <!-- Row 2 -->
      <g transform="translate(16, 114)">
        <text x="16" y="16" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748B">2</text>
        <text x="48" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Mombasa Port</text>
        <text x="164" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#E2E8F0">890</text>
        <text x="264" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">$44,500.00</text>
        <text x="384" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#E2E8F0">Logistics</text>
        <rect x="504" y="3" width="56" height="18" rx="4" fill="rgba(16,185,129,0.18)" />
        <text x="514" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#10B981">VERIFIED</text>
        <text x="644" y="16" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Deduplicated row</text>
        <line x1="0" y1="26" x2="802" y2="26" stroke="rgba(255,255,255,0.04)" />
      </g>

      <!-- Row 3 -->
      <g transform="translate(16, 144)">
        <text x="16" y="16" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748B">3</text>
        <text x="48" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Nakuru Hub</text>
        <text x="164" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#E2E8F0">2,150</text>
        <text x="264" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">$118,250.00</text>
        <text x="384" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#E2E8F0">Retail</text>
        <rect x="504" y="3" width="56" height="18" rx="4" fill="rgba(56,189,248,0.18)" />
        <text x="514" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#38BDF8">CLEANED</text>
        <text x="644" y="16" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Type inferred numeric</text>
