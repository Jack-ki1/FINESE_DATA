      <text x="20" y="44" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Frequency histogram calculated client-side</text>
      <rect x="424" y="16" width="76" height="20" rx="5" fill="rgba(56,189,248,0.15)" />
      <text x="438" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38BDF8">REALTIME</text>

