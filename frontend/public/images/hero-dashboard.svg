  <!-- Floating Glow Badges (linear aesthetics) -->
  <g transform="translate(1000, 140)" filter="url(#cardShadow)">
    <rect width="160" height="52" rx="12" fill="#1E293B" stroke="rgba(16,185,129,0.5)" stroke-width="1.5" />
    <circle cx="24" cy="26" r="6" fill="#10B981" filter="url(#neonGlow)" />
    <text x="38" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Zero Data Leaves</text>
    <text x="38" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Browser sandbox</text>
  </g>

  <g transform="translate(10, 480)" filter="url(#cardShadow)">
    <rect width="180" height="52" rx="12" fill="#1E293B" stroke="rgba(99,102,241,0.5)" stroke-width="1.5" />
    <circle cx="24" cy="26" r="6" fill="#818CF8" filter="url(#neonGlow)" />
    <text x="38" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">SQL Workbench</text>
    <text x="38" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#38BDF8">Instant GROUP BY</text>
  </g>
</svg>
