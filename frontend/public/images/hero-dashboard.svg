      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8">QUERY TIME</text>
      <text x="16" y="56" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#10B981">0.4 ms</text>
      <text x="16" y="74" font-family="system-ui, sans-serif" font-size="9.5" fill="#10B981">Zero network overhead</text>
