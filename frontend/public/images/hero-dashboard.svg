      <rect width="834" height="200" rx="14" fill="url(#surfaceGrad)" stroke="rgba(255,255,255,0.08)" />
      <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">In-Memory Dataset Grid</text>
      <text x="20" y="42" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Showing live parsed rows with instant filtering</text>

      <!-- Table Header -->
