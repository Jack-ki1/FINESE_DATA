      <text x="104" y="210" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Mombasa</text>
      <text x="108" y="97" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0">22.8k</text>

      <!-- Bar 3 (Peak) -->
