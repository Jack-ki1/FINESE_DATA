      <text x="166" y="210" font-family="system-ui, sans-serif" font-size="9.5" fill="#38BDF8" font-weight="bold">Nakuru</text>
      <text x="168" y="62" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#38BDF8">38.4k</text>

      <!-- Bar 4 -->
      <rect x="220" y="125" width="42" height="70" rx="4" fill="url(#primaryGrad)" />
      <text x="228" y="210" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Kisumu</text>
      <text x="230" y="117" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0">17.1k</text>

      <!-- Bar 5 -->
      <rect x="280" y="90" width="42" height="105" rx="4" fill="url(#primaryGrad)" />
      <text x="288" y="210" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Eldoret</text>
      <text x="290" y="82" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0">26.5k</text>

      <!-- Bar 6 -->
      <rect x="340" y="135" width="42" height="60" rx="4" fill="url(#primaryGrad)" />
      <text x="348" y="210" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Thika</text>
      <text x="350" y="127" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0">15.9k</text>

      <!-- Bar 7 -->
      <rect x="400" y="110" width="42" height="85" rx="4" fill="url(#primaryGrad)" />
      <text x="408" y="210" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Nyeri</text>
      <text x="410" y="102" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0">21.0k</text>
