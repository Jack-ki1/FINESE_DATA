      <rect width="300" height="230" rx="14" fill="url(#surfaceGrad)" stroke="rgba(255,255,255,0.08)" />
      <text x="18" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Field Profile &amp; Types</text>
      <text x="18" y="44" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Automated schema inference</text>

      <!-- Column 1 -->
      <g transform="translate(18, 58)">
