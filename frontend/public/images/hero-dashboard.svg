        <rect x="180" y="0" width="70" height="18" rx="4" fill="rgba(56,189,248,0.2)" />
        <text x="198" y="13" font-family="system-ui, sans-serif" font-size="9.5" fill="#38BDF8">Text</text>
        <text x="0" y="28" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">8 unique values</text>
        <line x1="0" y1="36" x2="260" y2="36" stroke="rgba(255,255,255,0.05)" />
      </g>

      <!-- Column 3 -->
      <g transform="translate(18, 146)">
        <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">order_date</text>
        <rect x="180" y="0" width="70" height="18" rx="4" fill="rgba(16,185,129,0.2)" />
        <text x="194" y="13" font-family="system-ui, sans-serif" font-size="9.5" fill="#34D399">Date</text>
        <text x="0" y="28" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">2026-01 to 2026-10</text>
        <line x1="0" y1="36" x2="260" y2="36" stroke="rgba(255,255,255,0.05)" />
      </g>
