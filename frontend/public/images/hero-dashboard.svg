        <rect x="180" y="0" width="70" height="18" rx="4" fill="rgba(99,102,241,0.2)" />
        <text x="190" y="13" font-family="system-ui, sans-serif" font-size="9.5" fill="#818CF8">Number</text>
        <text x="0" y="28" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">avg $4,820 • 0 nulls</text>
        <line x1="0" y1="36" x2="260" y2="36" stroke="rgba(255,255,255,0.05)" />
      </g>

      <!-- Column 2 -->
