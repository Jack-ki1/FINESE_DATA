<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow behind window -->
  <circle cx="300" cy="200" r="260" fill="#6366F1" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="900" cy="400" r="280" fill="#06B6D4" opacity="0.1" filter="url(#neonGlow)" />

  <!-- Main App Window Frame -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="30" width="1120" height="700" rx="20" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <rect x="40" y="30" width="1120" height="52" rx="20" fill="#1E293B" fill-opacity="0.6" />
    <path d="M40 82 H1160" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Traffic lights -->
    <circle cx="68" cy="56" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="88" cy="56" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="108" cy="56" r="6" fill="#10B981" opacity="0.8" />

    <!-- Studio URL / Search Bar -->
    <rect x="360" y="44" width="480" height="26" rx="6" fill="#0F172A" stroke="rgba(255,255,255,0.06)" />
    <circle cx="376" cy="57" r="4" fill="#10B981" />
    <text x="390" y="61" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">
      localhost:3000/studio • <tspan fill="#38BDF8">sales_q3_report.csv</tspan> (Client Memory)
    </text>

    <!-- Top Window Actions -->
    <rect x="1030" y="44" width="100" height="26" rx="6" fill="url(#primaryGrad)" />
    <text x="1052" y="61" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Export CSV</text>
  </g>

  <!-- Left Sidebar -->
  <g transform="translate(40, 83)">
    <rect width="210" height="647" fill="#0B132B" fill-opacity="0.5" />
    <line x1="210" y1="0" x2="210" y2="647" stroke="rgba(255,255,255,0.08)" />

    <!-- Sidebar Brand -->
    <text x="24" y="36" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="1">FINESE STUDIO</text>
    <rect x="145" y="24" width="46" height="16" rx="4" fill="rgba(56,189,248,0.15)" />
    <text x="153" y="36" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#38BDF8">LOCAL</text>

    <!-- Section: Workspace -->
    <text x="24" y="74" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="1.5">WORKSPACE</text>

    <!-- Nav Item: Overview (Active) -->
    <rect x="14" y="86" width="182" height="34" rx="8" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" />
    <circle cx="34" cy="103" r="5" fill="#818CF8" />
    <text x="50" y="108" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Studio Overview</text>

    <!-- Nav Item: Data Review -->
    <circle cx="34" cy="141" r="5" fill="#64748B" />
    <text x="50" y="146" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Data Review</text>

    <!-- Nav Item: Smart Cleaning -->
    <circle cx="34" cy="179" r="5" fill="#64748B" />
    <text x="50" y="184" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Smart Cleaning</text>

    <!-- Nav Item: Charts -->
    <circle cx="34" cy="217" r="5" fill="#64748B" />
    <text x="50" y="222" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Chart Builder</text>

    <!-- Section: Intelligence -->
    <text x="24" y="270" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="1.5">INTELLIGENCE</text>
    <circle cx="34" cy="298" r="5" fill="#64748B" />
    <text x="50" y="303" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Local Insights</text>
    <circle cx="34" cy="336" r="5" fill="#64748B" />
    <text x="50" y="341" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">SQL Workbench</text>

    <!-- Bottom Privacy Badge in Sidebar -->
    <rect x="16" y="550" width="178" height="74" rx="10" fill="#131F37" stroke="rgba(16,185,129,0.3)" />
    <circle cx="34" cy="574" r="5" fill="#10B981" />
    <text x="46" y="578" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">100% Private</text>
    <text x="24" y="598" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Zero cloud network calls.</text>
    <text x="24" y="612" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">Processed in memory.</text>
  </g>

  <!-- Workspace Canvas -->
  <g transform="translate(270, 104)">
    <!-- Header banner in canvas -->
    <text x="10" y="24" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">Quarterly Revenue &amp; Regional Performance</text>
    <text x="10" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">In-browser profiling computed across 50,000 records</text>

    <!-- 4 KPI Metrics Cards -->
    <!-- Metric 1: Rows -->
    <g transform="translate(10, 62)">
      <rect width="198" height="84" rx="12" fill="url(#surfaceGrad)" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8">TOTAL RECORDS</text>
      <text x="16" y="56" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">50,000</text>
      <text x="16" y="74" font-family="system-ui, sans-serif" font-size="9.5" fill="#10B981">✓ 100% Local memory</text>
    </g>

    <!-- Metric 2: Quality Score -->
    <g transform="translate(222, 62)">
      <rect width="198" height="84" rx="12" fill="url(#surfaceGrad)" stroke="rgba(99,102,241,0.25)" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8">DATA QUALITY</text>
      <text x="16" y="56" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">98.4<tspan font-size="14" fill="#94A3B8">/100</tspan></text>
      <text x="16" y="74" font-family="system-ui, sans-serif" font-size="9.5" fill="#38BDF8">High integrity audit</text>
    </g>

    <!-- Metric 3: Columns -->
    <g transform="translate(434, 62)">
      <rect width="198" height="84" rx="12" fill="url(#surfaceGrad)" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8">COLUMNS DETECTED</text>
      <text x="16" y="56" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">12 Fields</text>
      <text x="16" y="74" font-family="system-ui, sans-serif" font-size="9.5" fill="#94A3B8">8 Numeric • 4 String</text>
